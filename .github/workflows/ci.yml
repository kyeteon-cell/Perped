name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit

  smoke:
    # After Vercel finishes deploying this commit, open the live app in a real browser and check it.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the Vercel deployment of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            s=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/status --jq .state || echo pending)
            echo "deploy: $s"
            [ "$s" = "success" ] && exit 0
            [ "$s" = "failure" ] || [ "$s" = "error" ] && exit 1
            sleep 10
          done
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: node scripts/smoke.mjs
        env:
          BASE_URL: https://perped-final.vercel.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: smoke-out/
